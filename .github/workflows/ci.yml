name: FuelScope CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q app.py fuelscope
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r requirements.txt --progress-spinner off
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fuelscope .
      - run: docker run -d --name fuelscope -p 8501:8501 fuelscope
      - run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs fuelscope
          exit 1
      - run: >-
          docker exec fuelscope python -c
          "from pathlib import Path;
          from fuelscope.snapshot import read_snapshot;
          data, manifest = read_snapshot(Path('data/processed'));
          assert len(data) == manifest['row_count_valid'] == 1061899"
      - if: always()
        run: docker rm -f fuelscope || true
